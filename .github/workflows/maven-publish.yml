name: Maven Package

on:
  release:
    types: [created]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21 + Maven settings for GitHub Packages
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          server-id: github
          settings-path: ${{ github.workspace }}

      # Lấy version từ tag release: v0.0.2 -> 0.0.2
      - name: Set Maven version from release tag
        working-directory: demoo
        run: mvn -q versions:set -DnewVersion=${GITHUB_REF_NAME#v} -DgenerateBackupPoms=false

      - name: Build (skip tests)
        working-directory: demoo
        run: mvn -B -U clean package -DskipTests

      - name: Deploy to GitHub Packages (skip tests)
        working-directory: demoo
        run: mvn -B -U deploy -DskipTests -s $GITHUB_WORKSPACE/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

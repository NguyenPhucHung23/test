name: Maven Package

on:
  release:
    types: [created]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 + Maven settings for GitHub Packages
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Set Maven version from release tag
        working-directory: demoo
        run: mvn -q versions:set -DnewVersion=${GITHUB_REF_NAME#v} -DgenerateBackupPoms=false

      - name: Build (skip tests)
        working-directory: demoo
        run: mvn -B -U clean package -DskipTests

      - name: Verify artifacts exist
        working-directory: demoo
        run: |
          echo "=== list demoo/target ==="
          ls -la target
          ls -la target/*.jar || true

      - name: Deploy to GitHub Packages (deploy-file)
        working-directory: demoo
        run: |
          JAR=$(ls -1 target/*.jar | head -n 1)
          echo "Deploying: $JAR"
          mvn -B -U -DskipTests deploy:deploy-file \
            -s $GITHUB_WORKSPACE/settings.xml \
            -DrepositoryId=github \
            -Durl=https://maven.pkg.github.com/NguyenPhucHung/test \
            -DpomFile=pom.xml \
            -Dfile="$JAR"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

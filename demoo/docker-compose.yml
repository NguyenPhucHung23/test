version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: 123456
      TZ: Asia/Ho_Chi_Minh

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci"
      ]

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - app-network

  # Spring Boot Application
  app:
    build: .
    container_name: spring-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: 123456
    networks:
      - app-network


networks:
  app-network:
    driver: bridge

volumes:
  mysql_data: